name: 🚀 VPS Production Deploy

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🚀 Deploy website to VPS
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 📦 Install dependencies
        run: npm install

      - name: 🏗️ Build project
        run: npm run build

      - name: 🚀 Sync build folder to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 147.79.75.135
          username: root
          key: ${{ secrets.VPS_SSH_KEY || secrets.SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          source: "dist/*"
          target: "/var/www/sheerit.com.co"
          strip_components: 1
